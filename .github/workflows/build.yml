name: Build StandUp

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  package:
    name: Package ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run dist:win
            artifact: release/*.exe
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
            artifact: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify macOS app bundle
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="release/mac-universal/StandUp.app"
          helper="$app/Contents/Resources/app.asar.unpacked/node_modules/get-windows/main"
          test -x "$app/Contents/MacOS/StandUp"
          test -x "$helper"
          codesign --verify --deep --strict --verbose=2 "$app"
          file "$app/Contents/MacOS/StandUp" | grep -q "universal binary"
      - uses: actions/upload-artifact@v4
        with:
          name: StandUp-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
