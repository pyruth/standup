[package]
name = "standup"
version = "2.0.2"
description = "A private, offline-first stand-up reminder."
authors = ["ioiostudio"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/pyruth/standup"
edition = "2021"
rust-version = "1.85"

[lib]
name = "standup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
gif = "0.14.2"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
system-idle-time = "1.0.4"
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
