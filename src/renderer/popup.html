<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' standup-animation: http://standup-animation.localhost data:; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StandUp Reminder</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="reminder" aria-hidden="true">
      <div class="mello-stage" hidden>
        <div class="mello-message">
          <span class="mello-message-text">Stand up<br />move a little</span>
          <small class="mello-move" hidden></small>
        </div>
        <canvas class="mello-canvas" width="272" height="384"></canvas>
      </div>
      <img
        class="gif-animation"
        width="256"
        height="384"
        alt=""
      />
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
